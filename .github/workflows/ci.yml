name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DATABASE_URL: postgresql://raguser:ragpass@localhost:5432/ragdb
  RABBITMQ_URL: amqp://raguser:ragpass@localhost:5672
  MINIO_ENDPOINT: localhost:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  API_KEY: test-secret-key-for-ci
  EMBEDDING_MODEL_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  EMBEDDING_DIMENSION: 384

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r worker/requirements.txt
          pip install ruff mypy
      
      - name: Run Ruff (linting)
        run: |
          ruff check api/ worker/ tests/
      
      - name: Run MyPy (type checking)
        run: |
          mypy api/ worker/ --ignore-missing-imports || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ragpass
          POSTGRES_DB: ragdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raguser -d ragdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: raguser
          RABBITMQ_DEFAULT_PASS: ragpass
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r worker/requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx pytest-mock
      
      - name: Wait for services
        run: |
          sleep 10
          # Verify PostgreSQL is ready
          until pg_isready -h localhost -p 5432 -U raguser -d ragdb; do sleep 2; done
          # Verify RabbitMQ is ready
          until curl -f http://localhost:15672/api/healthchecks/node; do sleep 2; done
          # Verify MinIO is ready
          until curl -f http://localhost:9000/minio/health/live; do sleep 2; done
      
      - name: Run unit tests
        run: |
          pytest tests/test_api.py tests/test_worker.py -v --cov=api --cov=worker --cov-report=term-missing --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: unit-tests-coverage

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ragpass
          POSTGRES_DB: ragdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raguser -d ragdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: raguser
          RABBITMQ_DEFAULT_PASS: ragpass
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r worker/requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx pytest-mock
      
      - name: Wait for services
        run: |
          sleep 15
          until pg_isready -h localhost -p 5432 -U raguser -d ragdb; do sleep 2; done
          until curl -f http://localhost:15672/api/healthchecks/node; do sleep 2; done
          until curl -f http://localhost:9000/minio/health/live; do sleep 2; done
      
      - name: Initialize database (create tables, install pgvector)
        run: |
          # Install pgvector extension
          psql -h localhost -U raguser -d ragdb -c "CREATE EXTENSION IF NOT EXISTS vector;"
          # Create tables via API startup (or run migration script)
          python -c "
          import sys
          sys.path.insert(0, 'api')
          from api import models, database
          models.Base.metadata.create_all(bind=database.engine)
          print('Database tables created')
          "
      
      - name: Run integration tests
        run: |
          pytest tests/test_integration.py -v --cov=api --cov=worker --cov-report=term-missing --cov-report=xml --cov-append
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: integration-tests
          name: integration-tests-coverage

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: false
          tags: enterprise-rag-api:${{ github.sha }}
          load: true
      
      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: false
          tags: enterprise-rag-worker:${{ github.sha }}
          load: true
      
      - name: Test API image
        run: |
          docker run --rm -d --name test-api \
            -e DATABASE_URL=${{ env.DATABASE_URL }} \
            -e RABBITMQ_URL=${{ env.RABBITMQ_URL }} \
            -e MINIO_ENDPOINT=${{ env.MINIO_ENDPOINT }} \
            -e MINIO_ACCESS_KEY=${{ env.MINIO_ACCESS_KEY }} \
            -e MINIO_SECRET_KEY=${{ env.MINIO_SECRET_KEY }} \
            -e API_KEY=${{ env.API_KEY }} \
            -p 8000:8000 \
            enterprise-rag-api:${{ github.sha }}
          sleep 10
          curl -f http://localhost:8000/healthz
          docker stop test-api
      
      - name: Test Worker image
        run: |
          # Worker doesn't expose ports, just verify it starts
          docker run --rm -d --name test-worker \
            -e DATABASE_URL=${{ env.DATABASE_URL }} \
            -e RABBITMQ_URL=${{ env.RABBITMQ_URL }} \
            -e MINIO_ENDPOINT=${{ env.MINIO_ENDPOINT }} \
            -e MINIO_ACCESS_KEY=${{ env.MINIO_ACCESS_KEY }} \
            -e MINIO_SECRET_KEY=${{ env.MINIO_SECRET_KEY }} \
            enterprise-rag-worker:${{ github.sha }}
          sleep 5
          docker logs test-worker
          docker stop test-worker

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r api/requirements.txt -r worker/requirements.txt || true

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, unit-tests, integration-tests, docker-build, security-scan]
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "CI pipeline failed. Check GitHub Actions for details."
          # Add Slack/Teams/Email notification here if needed