name: Minimum Flow CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          pip install torch==2.3.0 torchvision==0.18.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[api,worker,dev]'
      - name: Run unit tests without network services
        run: python -m pytest tests/test_api.py tests/test_worker.py tests/test_outbox.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage.xml

  real-pipeline:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30
    env:
      API_KEY: ci-minimum-flow-key
      TENANT_API_KEYS: ''
      POSTGRES_PORT: '55432'
      RAG_E2E_DATABASE_URL: postgresql://raguser:ragpass@localhost:55432/ragdb
      RAG_E2E_URL: http://localhost:8000
      RAG_E2E_API_KEY: ci-minimum-flow-key
      RAG_E2E_TIMEOUT: '600'
      RAG_TEST_COMPOSE_PROJECT: enterprise-rag-ci
      COMPOSE_PROJECT_NAME: enterprise-rag-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pytest-cov httpx==0.26.0 psycopg2-binary==2.9.9 minio==7.2.0 pika==1.3.1
      - name: Build and start real infrastructure, API and worker
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Verify upload, indexing, three search modes, reindex and deletion
        run: python -m pytest tests/test_integration.py --no-cov -v
      - name: Verify broker outages, redelivery, concurrent jobs and DLQ replay
        run: python -m pytest tests/test_resilience.py --no-cov -v
      - name: Show service logs
        if: always()
        run: docker compose logs --no-color --tail 150
      - name: Stop test stack
        if: always()
        run: docker compose down
