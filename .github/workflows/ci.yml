name: Acceptance and Quality CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==84.0.0
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[api,worker,dev]'
      - name: Lint and format
        run: |
          ruff check api worker shared tests evaluation benchmarks scripts migrations
          ruff format --check api worker shared tests evaluation benchmarks scripts migrations
      - name: Type checking on the Linux runtime platform
        run: mypy api worker shared evaluation benchmarks scripts --platform linux
      - name: Audit complete installed dependency snapshot, including CPU PyTorch
        run: python scripts/audit_dependencies.py
      - name: Unit contracts and line coverage
        run: |
          python -m pytest tests -q
          mkdir -p .test-results
          cp .coverage .test-results/unit.coverage
      - uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-data
          path: .test-results/unit.coverage
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          include-hidden-files: true
          path: |
            coverage.xml
            .test-results/dependency-audit.*

  acceptance:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45
    env:
      API_KEY: ci-minimum-flow-key
      TENANT_API_KEYS: '{"acme":"ci-tenant-acme-key"}'
      RAG_E2E_TENANT_KEY: ci-tenant-acme-key
      RAG_MONITORING_URL: http://localhost:9090
      POSTGRES_PORT: '55432'
      RAG_E2E_DATABASE_URL: postgresql://raguser:ragpass@localhost:55432/ragdb
      RAG_E2E_URL: http://localhost:8000
      RAG_E2E_API_KEY: ci-minimum-flow-key
      RAG_E2E_TIMEOUT: '600'
      RAG_TEST_COMPOSE_PROJECT: enterprise-rag-ci
      COMPOSE_PROJECT_NAME: enterprise-rag-ci
      COMPOSE_FILE: docker-compose.yml:docker-compose.test.yml
      OCR_ENABLED: 'true'
      CHUNK_TARGET_TOKENS: '48'
      CHUNK_OVERLAP_TOKENS: '6'
      EMBEDDING_BATCH_SIZE: '2'
      RATE_LIMIT_PER_MINUTE: '10000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pytest==9.1.1 pytest-cov==7.1.0 coverage==7.16.2 httpx==0.26.0 psycopg2-binary==2.9.9 minio==7.2.0 pika==1.3.1 pymupdf==1.24.7 python-docx==1.1.0 cryptography==50.0.2 prometheus-client==0.19.0 pip-audit==2.10.1
      - uses: actions/download-artifact@v4
        with:
          name: unit-coverage-data
          path: .test-results
      - name: Build instrumented real test stack
        run: docker compose --profile monitoring up -d --build --wait --wait-timeout 300
      - name: Real corpus, isolation, TLS, alerts, restore and fault recovery
        run: python -m pytest tests/test_integration.py tests/test_document_pipeline.py tests/test_operations.py tests/test_resilience.py --no-cov -v
      - name: Audit actual Linux API and worker installations
        run: |
          python scripts/audit_dependencies.py --project enterprise-rag-ci --service api --output .test-results/api-dependency-audit.json
          python scripts/audit_dependencies.py --project enterprise-rag-ci --service worker --output .test-results/worker-dependency-audit.json
      - name: Compare retrieval modes on 60 judged synthetic queries
        run: python -m evaluation.run_eval --check
      - name: Enforce at least 80 percent in every named domain module
        run: python scripts/collect_coverage.py --project enterprise-rag-ci
      - name: Production binaries for latency measurements, without coverage
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.test.yml:docker-compose.benchmark.yml
          CHUNK_TARGET_TOKENS: '96'
          CHUNK_OVERLAP_TOKENS: '12'
          EMBEDDING_BATCH_SIZE: '32'
        run: |
          docker compose --profile monitoring up -d --build --wait --wait-timeout 300
          python scripts/audit_dependencies.py --project enterprise-rag-ci --service api --output .test-results/api-production-dependency-audit.json
          python scripts/audit_dependencies.py --project enterprise-rag-ci --service worker --output .test-results/worker-production-dependency-audit.json
          python -m evaluation.run_eval --check --output .test-results/retrieval-default.json
          python -m benchmarks.run_benchmark --check-latency
          python -m scripts.demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          include-hidden-files: true
          path: |
            .test-results/*.json
            .test-results/*.xml
      - name: Service logs
        if: always()
        run: docker compose logs --no-color --tail 100
      - name: Stop disposable test project
        if: always()
        run: docker compose --profile monitoring down
