global:
  scrape_interval: 10s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9101
  - job_name: outbox
    dns_sd_configs:
      - names: [outbox]
        type: A
        port: 9102
