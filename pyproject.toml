[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise RAG Pipeline - Event-driven document ingestion and hybrid search"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Enterprise RAG Team", email = "team@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["setuptools==84.0.0"]

[project.optional-dependencies]
api = [
    "alembic==1.20.0",
    "PyJWT[crypto]==2.15.1",
    "fastapi==0.143.1",
    "uvicorn==0.27.0",
    "sqlalchemy==2.0.25",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.14.1",
    "pydantic-settings==2.1.0",
    "python-multipart==0.0.32",
    "aio-pika==9.3.1",
    "minio==7.2.0",
    "python-dotenv==1.2.4",
    "httpx==0.26.0",
    "prometheus-client==0.19.0",
    "pgvector==0.2.0",
    "sentence-transformers==6.1.0",
    "huggingface-hub==1.33.0",
    "transformers==5.19.0",
    "numpy==1.26.4",
    "torch==2.14.1",
]
worker = [
    "prometheus-client==0.19.0",
    "pika==1.3.1",
    "minio==7.2.0",
    "python-dotenv==1.2.4",
    "pymupdf==1.24.7",
    "python-docx==1.1.0",
    "beautifulsoup4==4.12.2",
    "sentence-transformers==6.1.0",
    "huggingface-hub==1.33.0",
    "transformers==5.19.0",
    "torch==2.14.1",
    "numpy==1.26.4",
    "sqlalchemy==2.0.25",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "pgvector==0.2.0",
]
dev = [
    "coverage==7.16.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.12.0",
    "httpx==0.26.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=api --cov=worker --cov=shared --cov-report=term-missing --cov-report=html --cov-report=xml"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["api", "worker", "shared"]
relative_files = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/.venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # function calls in default arguments
]
[tool.ruff.lint.per-file-ignores]
"api/backup.py" = ["T201"]
"api/reconcile_storage.py" = ["T201"]
"api/retention.py" = ["T201"]
"worker/replay_dlq.py" = ["T201"]
"evaluation/*.py" = ["T201"]
"benchmarks/*.py" = ["T201"]
"scripts/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "api.*",
    "worker.*",
]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "worker*", "shared*", "migrations*", "evaluation*", "benchmarks*"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
migrations = ["script.py.mako"]
evaluation = ["dataset.json"]

[[tool.mypy.overrides]]
# The repository's minio/ image directory shadows the untyped third-party package.
module = ["minio", "minio.*"]
follow_imports = "skip"
