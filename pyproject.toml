[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise RAG Pipeline - Event-driven document ingestion and hybrid search"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Enterprise RAG Team", email = "team@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi==0.109.0",
    "uvicorn==0.27.0",
    "sqlalchemy==2.0.25",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "python-multipart==0.0.6",
    "aio-pika==9.3.1",
    "minio==7.2.0",
    "python-dotenv==1.0.0",
    "httpx==0.26.0",
    "prometheus-client==0.19.0",
    "pgvector==0.2.0",
    "sentence-transformers==2.2.2",
    "numpy==1.26.4",
]
worker = [
    "pika==1.3.1",
    "minio==7.2.0",
    "python-dotenv==1.0.0",
    "pymupdf==1.24.7",
    "python-docx==1.1.0",
    "beautifulsoup4==4.12.2",
    "sentence-transformers==2.2.2",
    "torch==2.3.0",
    "numpy==1.26.4",
    "sqlalchemy==2.0.25",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "pgvector==0.2.0",
]
dev = [
    "pytest==7.4.4",
    "pytest-cov==4.1.0",
    "pytest-asyncio==0.23.3",
    "pytest-mock==3.12.0",
    "httpx==0.26.0",
    "ruff==0.1.15",
    "mypy==1.7.1",
    "pip-audit==2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=api --cov=worker --cov-report=term-missing --cov-report=html --cov-report=xml"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["api", "worker"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/.venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # function calls in default arguments
]
per-file-ignores = {
    "tests/*": ["S101"],  # allow assert in tests
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "api.*",
    "worker.*",
]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "worker*"]

[tool.setuptools.package-dir]
"" = "."